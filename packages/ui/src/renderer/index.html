<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAIWORK</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        /* Vintage Golden --background / --textPrimary, inlined so the very
           first paint is already the right colour instead of flashing. */
        background-color: #342012;
        color: #e2ca95;
        font-family: Verdana_m1, Verdana, Geneva, sans-serif;
      }
    </style>
    <script>
      ;(function () {
        try {
          document.documentElement.setAttribute('data-theme', 'dark')
        } catch (error) {
          const rawConsole = globalThis?.["console"]
          rawConsole?.warn?.('Failed to apply initial theme', error)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
