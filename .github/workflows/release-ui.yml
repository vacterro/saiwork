name: Release UI

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build from"
        required: false
        default: ""
        type: string
      version:
        description: "Release version to embed"
        required: false
        default: ""
        type: string
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  release-ui:
    # Automated via reusable call; manual runs are limited to the default branch.
    if: ${{ github.event_name == 'workflow_call' || github.ref == 'refs/heads/saiwork' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set release metadata
        if: ${{ inputs.version != '' }}
        run: npm run bumpVersion -- "${{ inputs.version }}" --allow-same-version

      - name: Install dependencies
        run: npm ci --workspaces --include=optional

      - name: Run release gate
        run: npm run release:check

      - name: Ensure rollup native binary
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Install Cloudflare worker deps
        run: npm ci
        working-directory: packages/cloudflare

      - name: Build UI
        run: npm run build --workspace @saiwork/ui

      - name: Publish UI zip + update manifest
        working-directory: packages/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAIWORK_R2_BUCKET: ${{ vars.SAIWORK_R2_BUCKET }}
        run: npm run release:ui
